<aside class="menu">
    <div class="menu-logo">
        <span class="logo-icono" aria-hidden="true">A</span>
        <span class="logo-texto">{{ nombreSistema }}</span>
    </div>

    <nav class="menu" aria-label="Navegación principal">
        @for (item of menu; track item.ruta) {
            <a
                [routerLink]="item.ruta"
                routerLinkActive="activo"
                ariaCurrentWhenActive="page">
                <span class="icon" aria-hidden="true">{{ item.icono }}</span>
                <span>{{ item.nombre }}</span>
            </a>
        }
    </nav>

    <div class="menu-bottom">
        <button type="button" class="btn-nuevo" (click)="nuevoMovimiento()">
            <span aria-hidden="true">+</span> Nuevo movimiento
        </button>

        <div class="usuario-chip">
            <span class="avatar" aria-hidden="true">{{ inicialUsuario }}</span>
            <span class="nombre">{{ usuario }}</span>
        </div>
    </div>
</aside>
