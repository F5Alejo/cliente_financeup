<app-finanzas-menu></app-finanzas-menu>
<div class="metas-pagina">
    <header class="metas-header">
        <div>
            <h1>Tus metas de ahorro</h1>
            <p class="metas-sub">Sigue el avance de cada una de tus metas.</p>
        </div>
        <button type="button" class="btn-nueva-meta" (click)="nuevaMeta()">+ Nueva meta</button>
    </header>

    <section class="panel">
        <div class="metas-grid">
            @for (meta of metas; track meta.nombre) {
                <div class="meta-item">
                    <div class="meta-anillo">
                        <svg width="88" height="88" viewBox="0 0 88 88" role="img" [attr.aria-label]="meta.nombre + ': ' + meta.porcentaje + ' por ciento completado'">
                            <circle cx="44" cy="44" r="30" fill="none" stroke="#e2e8f0" stroke-width="7" />
                            <circle
                                cx="44" cy="44" r="30" fill="none" stroke="var(--green-primary)" stroke-width="7"
                                stroke-linecap="round"
                                [attr.stroke-dasharray]="circunferencia"
                                [attr.stroke-dashoffset]="obtenerOffset(meta.porcentaje)"
                                transform="rotate(-90 44 44)" />
                        </svg>
                        <span class="meta-icono" aria-hidden="true">{{ meta.icono }}</span>
                        <span class="meta-porcentaje">{{ meta.porcentaje }}%</span>
                    </div>
                    <span class="meta-nombre">{{ meta.nombre }}</span>
                    <span class="meta-montos">{{ meta.actual | moneda }} / {{ meta.objetivo | moneda }}</span>
                    <span class="meta-restante">Faltan {{ (meta.objetivo - meta.actual) | moneda }}</span>
                </div>
            }
        </div>
    </section>
</div>
