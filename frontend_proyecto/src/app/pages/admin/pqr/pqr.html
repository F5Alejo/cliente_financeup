<app-admin-menu></app-admin-menu>
<div class="admin-pqr">
    <h1>PQR</h1>
    <p class="admin-sub">Cambia el estado de los tickets o elimínalos.</p>

    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Número</th>
                <th>Estado</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (pqr of pqrService.pqrs; track pqr.numero) {
                <tr>
                    <td>{{ pqr.titulo }}</td>
                    <td>{{ pqr.numero }}</td>
                    <td>
                        <select [value]="pqr.estado" (change)="cambiarEstado(pqr.numero, $event)">
                            @for (estado of estados; track estado) {
                                <option [value]="estado">{{ estado }}</option>
                            }
                        </select>
                    </td>
                    <td class="acciones">
                        <button type="button" class="btn-eliminar" (click)="eliminarPqr(pqr.numero)">Eliminar</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
