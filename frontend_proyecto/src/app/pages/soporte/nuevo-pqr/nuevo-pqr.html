<div class="pqr-card">
  <button class="btn-volver" type="button" (click)="volver()" aria-label="Volver">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <header class="pqr-header">
    <h1 class="pqr-title">{{ titulo }}</h1>
    <p class="pqr-meta">{{ labelNumeroPeticion }} {{ numeroPeticion }}</p>
    <p class="pqr-meta">{{ labelUsuario }} {{ usuario }}</p>
  </header>

  <div class="pqr-divider">
    <span class="pqr-divider-dot"></span>
    <span class="pqr-divider-line"></span>
    <span class="pqr-divider-arrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>

  <form class="pqr-form" (ngSubmit)="enviar()">
    <div class="pqr-form-grid">
      <div class="pqr-form-fields">
        <label class="pqr-label" for="asunto">{{ labelAsunto }}</label>
        <input
          id="asunto"
          name="asunto"
          type="text"
          class="pqr-input"
          [placeholder]="placeholderAsunto"
          [(ngModel)]="asunto"
        />

        <label class="pqr-label" for="descripcion">{{ labelDescripcion }}</label>
        <textarea
          id="descripcion"
          name="descripcion"
          class="pqr-textarea"
          [placeholder]="placeholderDescripcion"
          [(ngModel)]="descripcion"
        ></textarea>
      </div>

      <div class="pqr-form-attach">
        <label class="pqr-dropzone" for="archivo">
          <span class="pqr-dropzone-text">
            {{ nombreArchivo ? nombreArchivo : textoAdjuntar }}
          </span>
          <svg class="pqr-dropzone-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <input
            id="archivo"
            name="archivo"
            type="file"
            class="pqr-dropzone-input"
            (change)="onArchivoSeleccionado($event)"
          />
        </label>
      </div>
    </div>

    <div class="pqr-actions">
      <button type="submit" class="btn-enviar">{{ textoBotonEnviar }}</button>
    </div>
  </form>
</div>
