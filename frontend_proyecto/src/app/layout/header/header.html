<header class="app-header">
  <div class="header-container">
    <a routerLink="/home" class="brand" aria-label="Ir al inicio de FinanceUp">
      <img src="assets/logo.png" alt="FinanceUp" class="brand-logo">
    </a>

    <nav class="main-nav" aria-label="Navegacion principal">
      <a
        *ngFor="let item of navItemsVisibles"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    </nav>

    @if (authService.estaAutenticado()) {
      <div class="perfil-menu">
        <button
          type="button"
          class="perfil-boton"
          ngMenuTrigger
          #disparador="ngMenuTrigger"
          [menu]="menuPerfil"
        >
          <span class="perfil-avatar" aria-hidden="true">{{ iniciales }}</span>
          <span class="perfil-nombre">{{ authService.obtenerNombre() }}</span>
          <app-icon nombre="chevron-down" [tamano]="14" class="perfil-chevron" />
        </button>

        <div
          ngMenu
          #menuPerfil="ngMenu"
          class="perfil-dropdown"
          [class.abierto]="menuPerfil.visible()"
          (itemSelected)="elegir($event)"
        >
          <ng-template ngMenuContent>
            <div ngMenuItem value="perfil" class="perfil-item">
              <app-icon nombre="user" [tamano]="16" /> Ver perfil
            </div>
            @if (esAdmin) {
              <div ngMenuItem value="admin" class="perfil-item perfil-item-admin">
                <app-icon nombre="settings" [tamano]="16" /> Panel de administrador
              </div>
            }
            <div ngMenuItem value="salir" class="perfil-item perfil-item-boton">
              <app-icon nombre="log-out" [tamano]="16" /> Cerrar sesión
            </div>
          </ng-template>
        </div>
      </div>
    } @else {
      <div class="auth-actions">
        <a routerLink="/login" class="btn-login">
          Iniciar sesión
        </a>

        <a routerLink="/register" class="btn-register">
          Regístrate
        </a>
      </div>
    }
  </div>
</header>
